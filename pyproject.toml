[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robinhood-agent"
version = "0.1.0"
description = "An autonomous Robinhood trading agent built on the Claude Agent SDK and Robinhood's official Agentic Trading MCP server."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
robinhood-agent = "robinhood_agent.__main__:main"

[tool.setuptools]
packages = ["robinhood_agent"]
